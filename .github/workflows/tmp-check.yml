name: tmp-check
on:
  push:
    paths: [.github/workflows/tmp-check.yml]
permissions:
  contents: write
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          npm install --no-save --no-package-lock xlsx@0.18.5
          node scripts/build-safety.mjs
          node -e "
          const s=require('./data/safety.json'); const p=require('./data/plants.json'); const by=new Map(p.map(x=>[x.id,x]));
          const n=k=>Object.values(s.plants).filter(e=>e[k]).length;
          console.log('plants', Object.keys(s.plants).length, 'ansm', n('ansm'), 'tppt', n('tppt'), 'listB', Object.values(s.plants).filter(e=>e.ansm?.some(a=>a.list==='B')).length);
          for (const name of ['Urtica dioica','Colchicum autumnale','Sambucus nigra','Allium ursinum','Digitalis purpurea','Digitalis lutea','Taxus baccata','Taraxacum officinale','Aconitum napellus','Sambucus ebulus','Artemisia absinthium']) { const pl=p.find(x=>x.scientificName===name); console.log(name, JSON.stringify(pl && s.plants[pl.id])); }
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/safety.json
          git commit -m "Build data/safety.json (ANSM lists A/B, Agroscope TPPT)" && git push origin HEAD:${GITHUB_REF_NAME}
