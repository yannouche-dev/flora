name: tmp-check
on: { push: { branches: [claude/exciting-faraday-c4xk2r] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== iNat taxon photos"
          curl -s "https://api.inaturalist.org/v1/taxa/55911" | jq -c '.results[0] | {n:(.taxon_photos|length), p:(.taxon_photos[0:3]|map(.photo)), d:.default_photo}' | head -c 3000; echo
          echo "== iNat observations photos FR"
          curl -s "https://api.inaturalist.org/v1/observations?taxon_id=55911&place_id=6753&photos=true&photo_license=cc0,cc-by,cc-by-sa&quality_grade=research&per_page=2&order_by=votes" | jq -c '{total:.total_results, o:(.results[0]|{id,observed_on,place_guess,uri,location,user:.user.login,photos:.photos[0:2]})}' | head -c 2500; echo
          echo "== Commons size"
          curl -s "https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=%22Urtica%20dioica%22&gsrnamespace=6&gsrlimit=2&prop=imageinfo&iiprop=url|size|mime&iiurlwidth=900&format=json&origin=*" | jq -c '.query.pages' | head -c 1500; echo
          echo "== GBIF media hosts"
          curl -s "https://api.gbif.org/v1/occurrence/search?taxonKey=5839747&mediaType=StillImage&basisOfRecord=PRESERVED_SPECIMEN&limit=40&license=CC0_1_0&license=CC_BY_4_0" | jq -r '.results[].media[0].identifier' | sed -E 's#^(https?://[^/]+).*#\1#' | sort | uniq -c
          curl -s "https://api.gbif.org/v1/occurrence/search?taxonKey=5839747&mediaType=StillImage&basisOfRecord=PRESERVED_SPECIMEN&limit=3" | jq -c '.results[0] | {key, media:.media[0]}'
          echo "== GBIF image cache"
          curl -s -o /dev/null -w "%{http_code} %{content_type} %{size_download}\n" "https://api.gbif.org/v1/image/cache/200x/occurrence/$(curl -s 'https://api.gbif.org/v1/occurrence/search?taxonKey=5839747&mediaType=StillImage&basisOfRecord=PRESERVED_SPECIMEN&limit=1' | jq -r '.results[0].key')/media/$(curl -s 'https://api.gbif.org/v1/occurrence/search?taxonKey=5839747&mediaType=StillImage&basisOfRecord=PRESERVED_SPECIMEN&limit=1' | jq -r '.results[0].media[0].identifier' | md5sum | cut -d' ' -f1)"
          curl -sI "https://api.gbif.org/v1/image/cache/200x/occurrence/1/media/x" | grep -i "access-control\|HTTP" 
