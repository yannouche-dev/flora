name: tmp-check
on:
  push:
    branches: [claude/exciting-faraday-c4xk2r]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for t in region departement; do
            echo "== $t"
            curl -sS "https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=DescribeFeatureType&TYPENAMES=ADMINEXPRESS-COG-CARTO.LATEST:$t" | grep -o 'name="[^"]*"' | head -20
            curl -sS -o b.json "https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=ADMINEXPRESS-COG-CARTO.LATEST:$t&outputFormat=application/json&count=1"
            python3 -c "import json,os;d=json.load(open('b.json'));f=d['features'][0];g=f['geometry'];print(g['type']);print('first', g['coordinates'][0][0][0] if g['type']=='MultiPolygon' else g['coordinates'][0][0]);print('props', f['properties']);print('bytes', os.path.getsize('b.json'))" || head -c 400 b.json
          done
