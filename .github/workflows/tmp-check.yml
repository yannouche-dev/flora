name: tmp-check
on:
  push:
    branches: [claude/exciting-faraday-c4xk2r]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Nommer des points réels (IGN Géoplateforme)
        run: |
          cat > "$RUNNER_TEMP/probe.mjs" <<'JS'
          globalThis.localStorage = { getItem: () => null, setItem() {}, removeItem() {} };
          const real = globalThis.fetch;
          globalThis.fetch = async (url, init) => {
            const r = await real(url, init);
            const u = new URL(url);
            const body = await r.clone().text();
            let n = '?';
            try { n = JSON.parse(body).features?.length; } catch {}
            console.log(`   ${r.status} ${u.searchParams.get('TYPENAMES')} n=${n}${r.ok ? '' : ' ' + body.slice(0, 160)}`);
            if (r.ok && n) try { for (const f of JSON.parse(body).features.slice(0, 4)) { const p = f.properties; console.log(`      · ${p.toponyme ?? p.nom_officiel} | ${p.nature ?? ''} | ${p.nature_detaillee ?? ''} | imp=${p.importance ?? ''} | ${p.statut_du_toponyme ?? ''}`); } } catch {}
            return r;
          };
          const { placeNameAt, atPlace } = await import(process.cwd() + '/app/core/geoservices.js');
          const points = [
            ['Fontainebleau', 48.404, 2.70], ['Bois de Vincennes (lac)', 48.828, 2.435], ['Parc floral', 48.838, 2.444],
            ['Jardin des Plantes', 48.8440, 2.3590], ['Tête d’Or', 45.777, 4.853], ['Puy de Dôme', 45.7725, 2.9644],
            ['Châtel-Guyon forêt', 45.918, 3.045], ['Châtel-Guyon nord', 45.93, 3.06], ['Campagne Cher', 46.5, 2.5],
            ['Gorges du Tarn', 44.33, 3.33], ['Bois de Boulogne', 48.862, 2.249]
          ];
          for (const [label, lat, lon] of points) {
            console.log(`== ${label} (${lat}, ${lon})`);
            try { const f = await placeNameAt([lon, lat]); console.log(`   → ${JSON.stringify(f)} → « Mon parcours botanique ${f ? atPlace(f) : ''} »`); }
            catch (e) { console.log('   ERREUR ' + e.message); }
          }
          JS
          node "$RUNNER_TEMP/probe.mjs"
