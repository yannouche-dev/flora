name: Deploy web app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.webmanifest
      - sw.js
      - app/**
      - assets/**
      - vendor/**
      - lib/**
      - data/territories.json
      - data/lookalikes.json
      - data/safety.json
      - .github/workflows/deploy-pages.yml
  # Dataset commits are pushed with [skip ci]; redeploy once the dataset build finishes.
  workflow_run:
    workflows: [Build flora dataset]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Actions pinned by commit (a moved tag cannot change what is deployed); the comment names the release.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Keep tools/check.sh's DEPLOYED list in step with what is copied here.
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r index.html manifest.webmanifest sw.js .nojekyll app assets vendor lib _site/
          cp data/plants.json data/meta.json data/territories.json data/lookalikes.json data/safety.json _site/data/

      # The same checks as on pull requests (ci.yml), the precache against the assembled site: nothing is deployed
      # with a module that does not parse or link, a file the service worker misses, or broken safety data.
      - name: Check modules, imports, precache, safety data, CSP
        run: bash tools/check.sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
