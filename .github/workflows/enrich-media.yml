name: Enrich search media

on:
  workflow_run:
    workflows: ["Build flora dataset"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write

concurrency:
  group: flora-media-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate media enrichment script
        run: node --check scripts/enrich-thumbnail-fallbacks.mjs

      - name: Enrich missing thumbnails
        env:
          FALLBACK_CONCURRENCY: '4'
          FALLBACK_DELAY_MS: '220'
          FALLBACK_RETRY_DAYS: '90'
          GBIF_MEDIA_LIMIT: '30'
        run: node scripts/enrich-thumbnail-fallbacks.mjs

      - name: Validate media coverage
        run: |
          node -e "const p=require('./data/plants.json'); const n=p.filter(x=>x.thumbnail?.url).length; console.log(n+'/'+p.length+' plants with thumbnails'); if(n<3000) process.exit(1)"
          cat data/meta.json

      - name: Commit media enrichment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plants.json data/meta.json data/thumbnails.json
          if git diff --cached --quiet; then
            echo "Media enrichment unchanged"
          else
            git commit -m "Enrich search thumbnails [skip ci]"
            git pull --rebase origin main
            git push
          fi
