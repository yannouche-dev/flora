name: Enrich search media

# workflow_run runs with the rights of main: only on a build of main here (branches, and head_branch below), and the
# code checked out is that of main, never a pull request's.
on: # zizmor: ignore[dangerous-triggers]
  # After each dataset build of main only: a manual build on another branch never leads to a push to main.
  workflow_run:
    workflows: ["Build flora dataset"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

# Two jobs, as in build-dataset: « enrich » queries GBIF and iNaturalist with a read-only token and no credential
# left in the checkout; only « commit » may push to main, and only on main, the three files « enrich » handed over.
permissions: {}

concurrency:
  group: flora-media-enrichment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enrich:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      base: ${{ steps.base.outputs.sha }}

    steps:
      # Actions pinned by commit (a moved tag cannot change what runs); the comment names the release.
      # The latest commit of the branch (main, except for a manual run on another branch): after a dataset build, the
      # one that build just pushed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Note the commit enriched
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validate media enrichment script
        run: node --check scripts/enrich-thumbnail-fallbacks.mjs

      - name: Enrich missing thumbnails
        env:
          FALLBACK_CONCURRENCY: '4'
          FALLBACK_DELAY_MS: '220'
          FALLBACK_RETRY_DAYS: '90'
          GBIF_MEDIA_LIMIT: '30'
        run: node scripts/enrich-thumbnail-fallbacks.mjs

      # The photos changed plants.json: its new fingerprint, so that installed apps take it.
      - name: Fingerprint the dataset
        run: node scripts/fingerprint-dataset.mjs

      - name: Validate media coverage
        run: |
          node -e "const p=require('./data/plants.json'); const n=p.filter(x=>x.thumbnail?.url).length; console.log(n+'/'+p.length+' plants with thumbnails'); if(n<3000) process.exit(1)"
          cat data/meta.json

      - name: Hand over the enriched files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media
          path: |
            data/plants.json
            data/meta.json
            data/thumbnails.json
          if-no-files-found: error
          retention-days: 7

  commit:
    needs: enrich
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the media commit to main

    steps:
      # The commit that was enriched: a dataset commit pushed meanwhile makes the rebase below fail rather than be
      # overwritten by these files. The checkout keeps its credential for the push below: this job runs no outside
      # code and uploads no artifact.
      - name: Checkout # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.enrich.outputs.base }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Take the enriched files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: media
          path: ${{ runner.temp }}/media

      - name: Put them in place
        run: cp "$RUNNER_TEMP"/media/plants.json "$RUNNER_TEMP"/media/meta.json "$RUNNER_TEMP"/media/thumbnails.json data/

      # The files as received, checked before they are versioned: thumbnails, and the safety data plants.json carries.
      - name: Check media coverage and safety data
        run: |
          node -e "const p=require('./data/plants.json'); const n=p.filter(x=>x.thumbnail?.url).length; if(n<3000) process.exit(1)"
          node scripts/check-data.mjs

      - name: Commit media enrichment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plants.json data/meta.json data/thumbnails.json
          if git diff --cached --quiet; then
            echo "Media enrichment unchanged"
          else
            git commit -m "Enrich search thumbnails [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
