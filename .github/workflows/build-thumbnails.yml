name: Build search thumbnails

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-thumbnails.mjs
      - .github/workflows/build-thumbnails.yml

permissions:
  contents: write

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build thumbnails
        env:
          THUMBNAIL_CONCURRENCY: '10'
          CHECKPOINT_EVERY: '100'
          REQUEST_DELAY_MS: '40'
        run: node scripts/build-thumbnails.mjs

      - name: Validate thumbnails
        run: |
          node -e "const p=require('./data/plants.json'); const n=p.filter(x=>x.thumbnail?.url).length; console.log(n+'/'+p.length+' plants with thumbnails'); if(n<1000) process.exit(1)"

      - name: Commit thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plants.json data/thumbnails.json
          if git diff --cached --quiet; then
            echo "Thumbnails unchanged"
          else
            git commit -m "Add search thumbnails [skip ci]"
            git push
          fi
