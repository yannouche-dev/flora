name: CI

# On every pull request, before it is merged (and on main, and in a merge queue):
#  - « check »: tools/check.sh (deploy-pages runs it again before each deploy): modules parse, imports resolve, the
#    service worker precaches what is deployed, the safety data holds, the CSP matches index.html;
#  - « smoke »: tests/smoke.mjs opens every main screen of the site as deployed (tools/assemble-site.sh) in Chromium,
#    phone and desktop, and fails on a page error, a CSP violation, a console error, a file of the site that does not
#    load, or a screen left empty: what no build step and no parse check can see (a module that fails to link, a
#    component that throws when it renders) shows here, not as a blank screen in production.
# Not required checks of main yet: the data workflows push to main with GITHUB_TOKEN, which no ruleset bypass list
# accepts (README, « Protéger main »); until they push as a GitHub App, merge a pull request (or a merge queue entry)
# only when both are green.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its running check. Any other run is a group of its own (its run id): no commit
# of main has its check cancelled, nor dropped while it waits behind another (one group keeps one pending run).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Actions pinned by commit (a moved tag cannot change what runs); the comment names the release.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check modules, imports, precache, safety data, CSP
        run: bash tools/check.sh

  smoke:
    # Pinned: Playwright installs the browser's system libraries for a known Ubuntu release.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The versions and checksums of package-lock.json (Playwright, from npm), without install scripts.
      - name: Install dev dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # The site as deploy-pages publishes it: static files, any static server serves them.
      - name: Open every screen (phone and desktop)
        timeout-minutes: 6
        run: |
          bash tools/assemble-site.sh _site
          python3 -m http.server 8000 --bind 127.0.0.1 --directory _site >/dev/null 2>&1 &
          for _ in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8000/ && break; sleep 1; done
          node tests/smoke.mjs http://127.0.0.1:8000/

      # After the test, so a new advisory never hides its result.
      - name: Audit dev dependencies
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
