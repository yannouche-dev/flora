name: Build flora dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**/*.mjs
      - lib/**/*.mjs
      - .github/workflows/build-dataset.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download official TAXREF v18 archive
        run: |
          mkdir -p .cache/taxref
          curl -L --fail --retry 3 "https://assets.patrinat.fr/files/referentiel/TAXREF_v18_2025.zip" -o .cache/taxref.zip
          unzip -q .cache/taxref.zip -d .cache/taxref

      - name: Validate runtime modules
        run: node --check lib/plant-sources.mjs

      - name: Build dataset
        run: node scripts/build-plants.mjs

      - name: Enrich search thumbnails
        env:
          WIKIMEDIA_DELAY_MS: '2000'
          THUMBNAIL_RETRY_DAYS: '90'
        run: node scripts/enrich-thumbnails.mjs

      - name: Validate dataset
        run: |
          node -e "const p=require('./data/plants.json'); const m=require('./data/meta.json'); const n=p.filter(x=>x.thumbnail?.url).length; if(!Array.isArray(p)||p.length<4500||p.length>8000) process.exit(1); if(p.length!==m.plants) process.exit(1); if(n<3000) throw new Error('Thumbnail coverage unexpectedly low: '+n); console.log(p.length+' plants; '+m.vernacularNames+' French vernacular names; '+n+' thumbnails')"
          cat data/meta.json

      - name: Commit generated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plants.json data/meta.json data/thumbnails.json
          if git diff --cached --quiet; then
            echo "Dataset unchanged"
          else
            git commit -m "Build TAXREF v18 flora dataset [skip ci]"
            git push
          fi
