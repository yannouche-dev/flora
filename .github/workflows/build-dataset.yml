name: Build flora dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-plants.mjs
      - .github/workflows/build-dataset.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official TAXREF v18 archive
        run: |
          mkdir -p .cache/taxref
          curl -L --fail --retry 3 "https://assets.patrinat.fr/files/referentiel/TAXREF_v18_2025.zip" -o .cache/taxref.zip
          unzip -q .cache/taxref.zip -d .cache/taxref
          echo "Archive files:"
          find .cache/taxref -maxdepth 2 -type f -printf '%p %k KB\n' | sort
          echo "Likely TAXREF/TAXVERN headers:"
          for f in $(find .cache/taxref -type f \( -iname '*taxref*.txt' -o -iname '*taxvern*.txt' \)); do
            echo "=== $f ==="
            head -n 2 "$f" | cut -c1-3000
          done

      - name: Stop after archive inspection
        run: echo "Official TAXREF archive downloaded successfully"
