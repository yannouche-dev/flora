name: Build flora dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-plants.mjs
      - .github/workflows/build-dataset.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download TAXREF Darwin Core Archive
        run: |
          mkdir -p .cache/taxref
          curl -L --fail --retry 3 "https://ipt.gbif.fr/archive.do?r=taxref" -o .cache/taxref.zip
          unzip -q .cache/taxref.zip -d .cache/taxref
          echo "Archive files:"
          find .cache/taxref -maxdepth 2 -type f -printf '%p %k KB\n' | sort
          echo "Text headers:"
          for f in .cache/taxref/*.txt; do
            echo "=== $f ==="
            head -n 2 "$f" | cut -c1-2000
          done

      - name: Stop after archive inspection
        run: echo "TAXREF archive downloaded successfully"
