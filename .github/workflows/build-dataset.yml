name: Build flora dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-plants.mjs
      - .github/workflows/build-dataset.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build dataset
        env:
          TAXREF_VERSION: '18.0'
          DETAIL_CONCURRENCY: '6'
        run: node scripts/build-plants.mjs

      - name: Validate JSON
        run: |
          node -e "const p=require('./data/plants.json'); if(!Array.isArray(p)||p.length<4000) process.exit(1); console.log(p.length+' plants validated')"
          cat data/meta.json

      - name: Commit generated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plants.json data/meta.json
          if git diff --cached --quiet; then
            echo "Dataset unchanged"
          else
            git commit -m "Build TAXREF flora dataset [skip ci]"
            git push
          fi
